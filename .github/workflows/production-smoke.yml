name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://no-vo-projeto.vercel.app
      SUPABASE_URL: https://kqrawaxfaahccrakqhrg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_sJAPKzbPXvjKwSF2EPadsQ_-50Qt-WV
    steps:
      - name: Validate production runtime, Supabase and Auth
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 48); do
            status=$(curl -sS -o /tmp/planos.html -w "%{http_code}" "${BASE_URL}/planos?smoke=${GITHUB_SHA}&attempt=${attempt}" || true)
            if [ "$status" = "200" ] \
              && ! grep -q "Planos ainda não carregados" /tmp/planos.html \
              && grep -q "Essencial" /tmp/planos.html \
              && grep -q "Profissional" /tmp/planos.html \
              && grep -q ">IA<" /tmp/planos.html; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" != "1" ]; then
            echo "Production did not load the three Supabase plans."
            cat /tmp/planos.html || true
            exit 1
          fi

          for path in / /login /cadastro /planos /api/v1/openapi.json /robots.txt; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}${path}")
            if [ "$code" != "200" ]; then
              echo "Unexpected HTTP ${code} for ${path}"
              exit 1
            fi
          done

          curl -sSI "${BASE_URL}/login" > /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^strict-transport-security:' /tmp/headers.txt

          curl -fsS \
            "${SUPABASE_URL}/rest/v1/plans?select=id,name,active&active=eq.true&order=sort_order" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            > /tmp/plans.json

          grep -q '"name":"Essencial"' /tmp/plans.json
          grep -q '"name":"Profissional"' /tmp/plans.json
          grep -q '"name":"IA"' /tmp/plans.json

          auth_status=$(curl -sS -o /tmp/auth-invalid.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "{\"email\":\"e2e-direct-${GITHUB_RUN_ID}@example.com\",\"password\":\"E2E-Invalid-Password-123!\"}")

          if [ "$auth_status" != "400" ]; then
            echo "Expected Supabase Auth invalid credentials response, got HTTP ${auth_status}."
            cat /tmp/auth-invalid.json
            exit 1
          fi
          grep -Eqi 'invalid_credentials|invalid login credentials' /tmp/auth-invalid.json

          curl -fsS -c /tmp/login.cookies "${BASE_URL}/login?smoke=${GITHUB_SHA}" -o /tmp/login.html
          action_field=$(grep -o '\$ACTION_ID_[a-f0-9]\+' /tmp/login.html | head -n 1)
          if [ -z "$action_field" ]; then
            echo "Could not discover the Next.js server action field on /login."
            exit 1
          fi

          login_final_url=$(curl -sS -L \
            -b /tmp/login.cookies -c /tmp/login.cookies \
            -H "Origin: ${BASE_URL}" \
            -H "Referer: ${BASE_URL}/login" \
            -o /tmp/login-result.html \
            -w "%{url_effective}" \
            -F "${action_field}=" \
            -F "email=e2e-app-${GITHUB_RUN_ID}@example.com" \
            -F "password=E2E-Invalid-Password-123!" \
            "${BASE_URL}/login")

          case "$login_final_url" in
            *"/login?erro=credenciais"*) ;;
            *)
              echo "App login did not reach the expected credentials error. Final URL: ${login_final_url}"
              cat /tmp/login-result.html || true
              exit 1
              ;;
          esac
          grep -q "Não foi possível entrar com essas credenciais" /tmp/login-result.html

          dashboard_final_url=$(curl -sS -L -o /tmp/dashboard-result.html -w "%{url_effective}" "${BASE_URL}/dashboard")
          case "$dashboard_final_url" in
            *"/login"*) ;;
            *)
              echo "Unauthenticated /dashboard did not redirect to login: ${dashboard_final_url}"
              exit 1
              ;;
          esac

          echo "Production smoke passed: Vercel runtime, Supabase Data API, Auth/GoTrue, admin rate limit path, protected routing and security headers are healthy."
